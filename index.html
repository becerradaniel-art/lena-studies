<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-title" content="Lena studies">
<meta name="theme-color" content="#1f45d6">
<title>Lena studies · Maths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600&family=Lexend:wght@600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm, encouraging study notebook for a 13-year-old: clear and friendly, never babyish
   IDEA: a school exercise book: blue covers with white name labels, squared paper inside, teacher's red pen, yellow highlighter
   PICTURE: six exercise books on the home page; graphs drawn on squared paper; worked steps written line by line down the page
   COLOUR and TYPE: biro-blue covers, highlighter yellow, red-pen notes on white squared paper; Lexend headings, Atkinson Hyperlegible body, Caveat handwriting for teacher notes
   LAYOUT: cover band then a grid of books; topic pages put the learning column beside the practice card, stacked on phones */
:root{color-scheme:light dark;
 --bg:light-dark(#ffffff,#0f1320);--grid:light-dark(#edf1fc,#161d2f);--card:light-dark(#ffffff,#161c2c);--ink:light-dark(#151925,#e8ebf4);--muted:light-dark(#566079,#a3abc0);
 --line:light-dark(#d6dcef,#2c3654);--blue:light-dark(#1f45d6,#86a2ff);--cover:light-dark(#1f45d6,#2445c4);--cover-dk:light-dark(#1536ad,#18318f);
 --hl:light-dark(#ffe45c,#e9cd45);--hl-ink:#1d1b0e;--red:light-dark(#cf1f3a,#ff7a89);--soft:light-dark(#f3f6ff,#1b2338);
 --gmin:light-dark(#e6ebf7,#20283e);--gmaj:light-dark(#b8c3e0,#3b4767);--star:light-dark(#e0a100,#ffd34d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 'Atkinson Hyperlegible',system-ui,sans-serif;overflow-x:clip;
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px}
h1,h2,h3{font-family:Lexend,system-ui,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,5.4vw,48px);font-weight:700;letter-spacing:-.01em}
h2{font-size:22px;font-weight:600;margin-bottom:12px}
h3{font-size:17px;font-weight:600;margin:18px 0 8px}
a{color:var(--blue)}
b{font-weight:700}
sup{font-size:.7em;line-height:0}
.small,.muted{font-size:14px}.muted{color:var(--muted);margin:-6px 0 10px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.15;margin:0 .14em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .2em}
.fr>span:last-child{padding:0 .2em}
i{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1.06em}
.aside{color:var(--muted);font-size:14px}

/* buttons */
.btn{font:600 15px/1.2 'Atkinson Hyperlegible',system-ui,sans-serif;min-height:44px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:light-dark(#fff,#0f1320)}
.btn:disabled{opacity:.5;cursor:default}
:is(a,button,input,summary):focus-visible{outline:3px solid var(--hl);outline-offset:2px;border-radius:8px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}

/* cover / home */
.cover{background:var(--cover);color:#fff;padding:clamp(32px,5vw,64px) max(5vw,16px) clamp(36px,5vw,60px);position:relative;
 box-shadow:inset 0 -10px 0 var(--cover-dk)}
.cover-in{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center}
.kicker{margin:0 0 10px;font-size:14px;opacity:.85}
.lede{max-width:60ch;margin:16px 0 0;font-size:17px;opacity:.95}
.lede.small{font-size:14px;opacity:.85}
.label{background:#fff;color:#1b2033;border-radius:10px;padding:14px 20px;transform:rotate(-1.5deg);box-shadow:0 10px 24px rgba(0,0,0,.22)}
.label div{display:flex;gap:12px;align-items:baseline;border-bottom:1.5px solid #c9d0e6;padding:6px 0}
.label div:last-child{border-bottom:0}
.label span{font-size:14px;color:#56607a;width:4.6em;flex:none}
.label b{font:600 28px/1.1 Caveat,cursive;color:#1f45d6}
.band{padding:clamp(28px,4vw,56px) max(5vw,16px);max-width:1340px;margin:0 auto}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:26px}
.book{display:flex;flex-direction:column;gap:14px;text-decoration:none;color:#fff;background:var(--cover);border-radius:4px 14px 14px 4px;padding:18px 18px 18px 32px;
 box-shadow:inset 12px 0 0 var(--cover-dk),5px 5px 0 -1px var(--card),5px 5px 0 0 var(--line),9px 9px 0 -1px var(--card),9px 9px 0 0 var(--line);transition:transform .18s ease}
.book:hover{transform:translateY(-3px)}
.book-lab{background:#fff;color:#1b2033;border-radius:8px;padding:10px 14px;display:flex;gap:12px;align-items:center}
.bn{font:700 22px/1 Lexend,sans-serif;color:#fff;background:#1f45d6;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;flex:none}
.bt{font:600 22px/1.15 Lexend,sans-serif}
.book-skills{display:flex;flex-direction:column;gap:4px;font-size:15px}
.bs{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.22);padding:3px 0}
.book .stars span{color:rgba(255,255,255,.35)}.book .stars .on{color:var(--hl)}
.meter{height:10px;background:rgba(255,255,255,.22);border-radius:6px;overflow:hidden;margin-top:auto}
.meter i{display:block;height:100%;background:var(--hl);border-radius:6px}
.mtxt{font-size:14px;opacity:.9;margin-top:-6px}
.sheet-link{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px;align-items:center;margin-top:34px;padding:18px 22px;border-radius:14px;
 background:var(--card);border:1.5px solid var(--line);text-decoration:none;color:var(--ink)}
.sheet-link b{font:600 22px/1.2 Lexend,sans-serif}
.sheet-link b{background:linear-gradient(transparent 58%,var(--hl) 58%);justify-self:start;padding:0 2px}
:root[data-theme=dark] .sheet-link b,.sheet-link b{color:inherit}
.sheet-link span{color:var(--muted);font-size:15px}
.sheet-link .arrow{grid-row:1/3;grid-column:2;font-size:28px;color:var(--blue)}

/* topic */
.wrap{max-width:1240px;margin:0 auto;padding:22px max(4vw,16px) 64px}
.back{display:inline-flex;align-items:center;min-height:44px;font-weight:700;text-decoration:none}
.t-head{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.tn{font:700 26px/1 Lexend,sans-serif;color:#fff;background:var(--cover);width:52px;height:52px;border-radius:50%;display:grid;place-items:center;flex:none}
.tn.sm{width:34px;height:34px;font-size:17px;display:inline-grid;vertical-align:middle;margin-right:6px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-weight:700;font-size:15px}
.tab.on{background:var(--blue);border-color:var(--blue);color:light-dark(#fff,#0f1320)}
.tab.on .stars span{color:rgba(255,255,255,.4)}.tab.on .stars .on{color:var(--hl)}
:root[data-theme=dark] .tab.on .stars span{color:rgba(0,0,0,.3)}
.stars{white-space:nowrap;letter-spacing:1px;font-size:14px}.stars span{color:var(--line)}.stars .on{color:var(--star)}
.remember{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:4px 20px;margin-bottom:22px}
.remember summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font:600 18px/1.3 Lexend,sans-serif;padding:8px 0}
.remember summary::marker{color:var(--blue)}
.rem{margin:0;padding:0 0 14px;list-style:none;columns:2 340px;column-gap:36px}
.rem li{break-inside:avoid;padding:7px 0 7px 22px;position:relative;border-bottom:1px dashed var(--line)}
.rem li::before{content:'';position:absolute;left:2px;top:15px;width:9px;height:9px;border-radius:2px;background:var(--hl)}
.skill-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:0 26px}
@media(min-width:980px){.skill-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:20px}
.goal{margin:0 0 18px;font-size:17px;padding:12px 16px;border-radius:10px;background:var(--soft)}
.goal span{display:block;font-size:14px;color:var(--blue);font-weight:700}
.method{counter-reset:m;list-style:none;margin:0;padding:0}
.method li{counter-increment:m;position:relative;padding:6px 0 10px 44px}
.method li::before{content:counter(m);position:absolute;left:0;top:4px;width:30px;height:30px;border-radius:50%;background:var(--blue);color:light-dark(#fff,#0f1320);font:700 15px/30px Lexend,sans-serif;text-align:center}
.q{font-size:17px;padding:2px 0 2px 14px;border-left:4px solid var(--blue);margin-bottom:12px;line-height:1.7}
.choices{display:flex;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--muted);align-items:center;margin:0 0 8px}
.choices span{border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.steps{list-style:none;counter-reset:s;margin:10px 0 0;padding:0}
.steps li{counter-increment:s;position:relative;padding:10px 0 10px 40px;border-top:1px dashed var(--line)}
.steps li::before{content:counter(s);position:absolute;left:0;top:10px;width:26px;height:26px;border-radius:50%;border:2px solid var(--blue);color:var(--blue);font:700 14px/22px Lexend,sans-serif;text-align:center}
.st-t{display:block;font-size:14px;color:var(--muted);font-weight:700}
.st-m{display:block;font-size:17px;line-height:1.8}
.steps li.new{animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.steps li.new{animation:none}.book{transition:none}}
.watch .note{padding:8px 0 8px 16px;border-left:3px solid var(--line);margin:10px 0}
.watch .note p{margin:0}
.watch .note.her{border-left-color:var(--red)}
.from{display:block;font:600 22px/1 Caveat,cursive;color:var(--red);margin-bottom:4px}
.watch.big{margin-top:6px}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:0 20px}
.sheet .rem{columns:1}

/* practice */
.pr{border-color:var(--blue);border-width:2px}
.pr-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pr-head h2{margin:0}
.tag{font-size:14px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--blue)}
.pr-stars{margin-left:auto;font-size:18px}.pr-stars .stars{font-size:18px}
.ans label{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.unit{color:var(--muted);font-weight:400}
.row{display:flex;gap:8px}
.row input{flex:1;font:18px 'Atkinson Hyperlegible',system-ui,sans-serif;min-height:48px;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.row input:focus{border-color:var(--blue);outline:none}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.key{min-width:44px;min-height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);font:700 18px system-ui;cursor:pointer}
.hint{font-size:14px;color:var(--muted);margin:8px 0 0}
.mcq{display:grid;gap:8px}
.opt{text-align:left;min-height:48px;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 16px/1.3 'Atkinson Hyperlegible',system-ui,sans-serif;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.opt.wrong{border-color:var(--red);color:var(--red);text-decoration:line-through;opacity:1}
.opt:disabled{cursor:default}
.fb:empty{display:none}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:16px}
.fb.ok{background:var(--hl);color:var(--hl-ink)}
.fb.ok .btn.pri{background:#1f45d6;border-color:#1f45d6;color:#fff;margin-top:10px}
.fb.nearly{border:2px dashed var(--hl);background:var(--soft)}
.fb.no,.fb.bad{border-left:4px solid var(--red);background:var(--soft)}
.fb.no b,.fb.bad b{color:var(--red)}
.plus{font-weight:700;white-space:nowrap}

/* graphs */
.fig{position:relative;width:100%;min-height:240px;margin:6px 0 10px;background:var(--card);border-radius:8px}
.fig svg{position:absolute;inset:0;display:block}
.gm{stroke:var(--gmin);stroke-width:1}.gM{stroke:var(--gmaj);stroke-width:1}
.ax{stroke:var(--ink);stroke-width:1.6}
.tk{fill:var(--muted);font:12px 'Atkinson Hyperlegible',system-ui,sans-serif}
.al{fill:var(--ink);font:700 13px 'Atkinson Hyperlegible',system-ui,sans-serif}
.pt{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.lbf{stroke:var(--blue);stroke-width:2.6}
.gd{fill:none;stroke:var(--red);stroke-width:2.2;stroke-dasharray:7 5}
.gdot{fill:var(--red)}
.ptag{fill:var(--red);font:700 16px Lexend,sans-serif;paint-order:stroke;stroke:var(--card);stroke-width:4px}
.path{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round}
.hi{stroke:var(--hl);stroke-width:12;stroke-linecap:round}
.node{fill:var(--ink)}

@media(max-width:700px){.cover-in{grid-template-columns:minmax(0,1fr)}.label{max-width:320px;order:-1}}
@media(max-width:600px){body{font-size:16px}.card{padding:16px}.row{flex-wrap:wrap}.row .btn{flex:1}.book{padding-left:28px}}
.nw{white-space:nowrap}
.jump{display:none;margin-top:8px;font:700 15px 'Atkinson Hyperlegible',system-ui,sans-serif;color:var(--blue);background:none;border:0;padding:0;min-height:44px;cursor:pointer}
@media(max-width:979px){.jump{display:block}}

</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
/* ================= ENGINE: maths helpers, display, parsing, checking ================= */
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a};
let RND=Math.random;
const ri=(a,b)=>a+Math.floor(RND()*(b-a+1));
const pick=a=>a[Math.floor(RND()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(RND()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a};
const coin=(p=.5)=>RND()<p;
function seeded(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function withSeed(seed,fn){const old=RND;RND=seeded(seed);try{return fn()}finally{RND=old}}

/* rationals */
const R=(n,d=1)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return{n:n/g,d:d/g}};
const rmul=(a,b)=>R(a.n*b.n,a.d*b.d), rdiv=(a,b)=>R(a.n*b.d,a.d*b.n),
      radd=(a,b)=>R(a.n*b.d+b.n*a.d,a.d*b.d), rsub=(a,b)=>R(a.n*b.d-b.n*a.d,a.d*b.d);
const rval=r=>r.n/r.d;

/* display */
const MI='−';
const sg=n=>n<0?MI+Math.abs(n):''+n;
const round=(x,dp)=>Math.round((x+Number.EPSILON*Math.sign(x))*10**dp)/10**dp;
const fmtN=(x,dp=4)=>{const s=''+round(x,dp);return s.replace('-',MI)};
const money=x=>'£'+round(x,2).toFixed(2);
const moneyQ=x=>Math.abs(x-Math.round(x))<1e-9?'£'+Math.round(x):money(x);
const fr=(n,d)=>d==1?sg(n):`${n<0?MI:''}<span class="fr"><span>${Math.abs(n)}</span><span>${d}</span></span>`;
const frR=r=>fr(r.n,r.d);
function mixed(r){if(r.d==1)return sg(r.n);const neg=r.n<0,a=Math.abs(r.n);if(a<r.d)return fr(r.n,r.d);
  const w=Math.floor(a/r.d),m=a%r.d;return(neg?MI:'')+w+fr(m,r.d)}
function mixedTxt(r){if(r.d==1)return''+r.n;const neg=r.n<0,a=Math.abs(r.n);if(a<r.d)return(neg?'-':'')+a+'/'+r.d;
  const w=Math.floor(a/r.d),m=a%r.d;return(neg?'-':'')+w+' '+m+'/'+r.d}
const V=v=>`<i>${v}</i>`;
/* a term c·v^e as html; opts.first=true means no leading plus */
function termH(c,e,v,first){
  const a=Math.abs(c);let body=(e>0&&a==1)?'':''+a;
  if(e==1)body+=V(v);else if(e>1)body+=V(v)+'<sup>'+e+'</sup>';
  if(first)return(c<0?MI:'')+body;
  return(c<0?' '+MI+' ':' + ')+body;
}
/* list of [c,e] -> html, keeping order */
function termsH(list,v){let s='',first=true;for(const[c,e]of list){if(!c)continue;s+=termH(c,e,v,first);first=false}return s||'0'}
function termsA(list,v){return list.filter(t=>t[0]).map(([c,e])=>(c<0?'-':'+')+Math.abs(c)+(e?'*'+v+(e>1?'^'+e:''):'')).join('').replace(/^\+/,'')||'0'}
/* collect like terms: returns list sorted by descending power */
function collect(list){const m={};for(const[c,e]of list)m[e]=(m[e]||0)+c;return Object.keys(m).map(Number).sort((a,b)=>b-a).map(e=>[m[e],e]).filter(t=>t[0])}
const mono=(c,e,v)=>termH(c,e,v,true);
const bracket=s=>'('+s+')';
const sgnTerm=c=>c<0?` ${MI} ${Math.abs(c)}`:` + ${c}`;

/* ---------- answer parsing ---------- */
const UNI={'½':'1/2','¼':'1/4','¾':'3/4','⅓':'1/3','⅔':'2/3','⅛':'1/8','⅜':'3/8','⅝':'5/8','⅞':'7/8'};
function decToR(str){const neg=str.startsWith('-');str=str.replace('-','');const k=(str.split('.')[1]||'').length;
  const n=Math.round(parseFloat(str)*10**k);return R(neg?-n:n,10**k)}
function parseNum(s){
  if(s==null)return null;
  s=(''+s).toLowerCase().replace(/[−–—]/g,'-').replace(/,/g,'').replace(/£/g,'').trim();
  s=s.replace(/^[a-z]\s*=\s*/,'');
  s=s.replace(/(\d)\s*([½¼¾⅓⅔⅛⅜⅝⅞])/g,(m,a,b)=>a+' '+UNI[b]).replace(/[½¼¾⅓⅔⅛⅜⅝⅞]/g,m=>UNI[m]);
  s=s.replace(/^-\s+/,'-');
  let m,out;
  if(m=s.match(/^(-?)(\d+)\s+(\d+)\s*\/\s*(\d+)/)){
    const w=+m[2],a=+m[3],b=+m[4];if(!b)return null;
    out={form:'mixed',w,a,b,r:R((m[1]?-1:1)*(w*b+a),b)};
  }else if(m=s.match(/^(-?\d*\.?\d+)\s*\/\s*(-?\d*\.?\d+)/)){
    const a=m[1],b=m[2];if(!parseFloat(b))return null;
    if(a.includes('.')||b.includes('.')){const r=rdiv(decToR(a),decToR(b));out={form:'decfrac',r}}
    else out={form:'frac',a:+a,b:+b,r:R(+a,+b)};
  }else if(m=s.match(/^(-?\d*\.?\d+)/)){
    out={form:m[1].includes('.')?'dec':'int',r:decToR(m[1]),raw:m[1]};
  }else return null;
  const rest=s.slice(m[0].length);
  if(/\d/.test(rest))out.extra=rest;
  out.v=rval(out.r);return out;
}
function parseTimeMin(s){ // "2 h 40 min" / "2 hours 40" -> minutes
  s=(''+s).toLowerCase();let m=s.match(/(\d+(?:\.\d+)?)\s*h[a-z]*\s*(?:and\s*)?(\d+)?\s*(m|$)/);
  if(m)return parseFloat(m[1])*60+(m[2]?+m[2]:0);return null}

/* ---------- expression parsing (single bracket algebra) ---------- */
function parseExpr(src){
  let s=(''+src).toLowerCase().replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/[×·]/g,'*').replace(/÷/g,'/')
    .replace(/²/g,'^2').replace(/³/g,'^3');
  s=s.replace(/^[a-z]=/,'');
  if(!s)throw 0;
  const toks=s.match(/\d+(\.\d+)?|[a-z]|[+\-*/^()]/g)||[];
  if(toks.join('')!==s)throw 0;
  let i=0,letterDigit=false,vars=new Set();
  const peek=()=>toks[i],next=()=>toks[i++];
  const isAtomStart=t=>t!=null&&(/^[\d.]/.test(t)||/^[a-z]$/.test(t)||t=='(');
  function expr(){const terms=[];let sign=1;
    if(peek()=='+'||peek()=='-'){sign=next()=='-'?-1:1}
    terms.push([sign,term()]);
    while(peek()=='+'||peek()=='-'){const sgn=next()=='-'?-1:1;terms.push([sgn,term()])}
    const f=env=>terms.reduce((a,[s2,t])=>a+s2*t(env),0);f.n=terms.length;return f}
  function term(){let f=factor();
    for(;;){const t=peek();
      if(t=='*'||t=='/'){next();const g=factor(),h=f;f=t=='*'?(e=>h(e)*g(e)):(e=>h(e)/g(e))}
      else if(isAtomStart(t)){const g=factor(),h=f;f=e=>h(e)*g(e)}
      else break}
    return f}
  function factor(){if(peek()=='-'){next();const g=factor();return e=>-g(e)}if(peek()=='+'){next();return factor()}return power()}
  function power(){const a=atom();if(peek()=='^'){next();const b=factor();return e=>Math.pow(a(e),b(e))}return a}
  function atom(){const t=next();if(t==null)throw 0;
    if(/^[\d.]/.test(t)){const v=parseFloat(t);return()=>v}
    if(/^[a-z]$/.test(t)){vars.add(t);if(peek()&&/^[\d.]/.test(peek()))letterDigit=true;return e=>e[t]}
    if(t=='('){const g=expr();if(next()!=')')throw 0;return g}
    throw 0}
  const f=expr();if(i<toks.length)throw 0;

}
const PTS=[1.37,-2.21,0.53,3.17,-1.61];
function equiv(a,b,v){for(const x of PTS){const e={};e[v]=x;const p=a.f(e),q=b.f(e);if(!isFinite(p)||Math.abs(p-q)>1e-7*Math.max(1,Math.abs(q)))return false}return true}

/* ---------- checking ---------- */
function matchWrong(q,val,inputExpr){
  for(const w of q.wrong||[]){
    if(w.expr&&inputExpr){try{if(equiv(inputExpr,parseExpr(w.expr),q.v))return w.msg}catch(e){}}
    if(w.v!=null&&val!=null&&Math.abs(val-w.v)<=(q.tol||1e-9)+1e-9)return w.msg}
  return null}
function check(q,input){
  input=(input||'').trim();
  if(q.kind=='mcq'){return input==q.ans?{s:'ok'}:{s:'no',msg:(q.why&&q.why[input])||'Look again, or press “Show next step”.'}}
  if(!input)return{s:'empty',msg:'Type your answer first.'};
  if(q.kind=='expr'){
    let p;try{p=parseExpr(input)}catch(e){return{s:'bad',msg:'I couldn’t read that. Type powers as x^2 (or x²), for example 6x^2 − 2x.'}}
    if(p.letterDigit)return{s:'nearly',msg:'Write the number before the letter, like 4w (not w4). For a power, type w^2.'};
    for(const x of p.vars)if(x!==q.v)return{s:'no',msg:`Use the letter ${q.v} only.`};
    const target=parseExpr(q.ans);
    if(!equiv(p,target,q.v)){const w=matchWrong(q,null,p);return{s:'no',msg:w||'Check each multiplication again, especially the signs.'}}
    if(q.mode=='factorise'){
      const m=p.s.match(/^(.*?)\((.+)\)$/);
      if(!m)return{s:'nearly',msg:'That’s equal, but it isn’t factorised. Take the common factor outside a bracket.'};
      let pre=m[1]||'1';if(pre=='-')pre='-1';if(pre.endsWith('*'))pre=pre.slice(0,-1);
      try{const pp=parseExpr(pre),h=parseExpr(q.hcf),nh=parseExpr('-('+q.hcf+')');
        if(equiv(pp,h,q.v)||equiv(pp,nh,q.v))return{s:'ok'}}catch(e){}
      return{s:'nearly',msg:'That’s equal, but not fully factorised. Is there a bigger common factor you can take out?'}}
    if(p.hasBracket)return{s:'nearly',msg:'That’s equal, but it still has brackets. Multiply them out.'};
    if(p.n>q.terms)return{s:'nearly',msg:'Right idea. Now collect the like terms so it’s fully simplified.'};
    return{s:'ok'}}
  let p=parseNum(input);
  if(q.unit=='min'){const t=parseTimeMin(input);if(t!=null)p={v:t,r:decToR(''+t),form:'dec'}}
  if(!p)return{s:'bad',msg:'Type a number, like 12, 3.5, 7/3 or 2 1/3.'};
  if(q.kind=='rat'){
    const a=q.ans,r=p.r,eq=r.n*a.d===a.n*r.d;
    if(eq){
      if(p.form=='frac'&&gcd(p.a,p.b)!==1){const g=gcd(p.a,p.b);return{s:'nearly',msg:`That’s the right value. Now simplify it: divide the top and bottom by ${g}.`}}
      if(p.form=='mixed'&&(p.a>=p.b||gcd(p.a,p.b)!==1))return{s:'nearly',msg:'Right value. Simplify the fraction part fully.'};
      if((p.form=='dec'||p.form=='decfrac')&&a.d!=1&&!q.allowDec)return{s:'nearly',msg:'Right value! Now write it as a fraction.'};
      if(p.form=='frac'&&Math.abs(a.n)>a.d&&q.preferMixed)return{s:'ok',note:`As a mixed number that’s ${mixed(a)}.`};
      return{s:'ok'}}
    if(a.d!=1&&Math.abs(p.v-rval(a))<0.006)return{s:'nearly',msg:'Very close. Give the exact answer as a fraction instead of a rounded decimal.'};
    const w=matchWrong(q,p.v);if(w)return{s:'no',msg:w};
    if(Math.abs(p.v+rval(a))<1e-9)return{s:'no',msg:'Right size, wrong sign. Check your positives and negatives.'};
    if(r.n&&R(r.d,r.n).n*a.d===a.n*R(r.d,r.n).d)return{s:'no',msg:'Looks like your fraction is upside down.'};
    return{s:'no',msg:'Try again, or press “Show next step”.'}}
  // numeric
  const tol=q.tol||1e-9,v=p.v;
  if(Math.abs(v-q.ans)<=tol+1e-9){
    if(q.money&&/\.\d$/.test(p.raw||''))return{s:'ok',note:`Money always has 2 decimal places: ${money(q.ans)}.`};
    return{s:'ok'}}
  const w=matchWrong(q,v);if(w)return{s:'no',msg:w};
  if(q.near&&Math.abs(v-q.ans)<=q.near)return{s:'nearly',msg:q.nearMsg||'Very close. Check your rounding.'};
  if(Math.abs(v+q.ans)<=tol)return{s:'no',msg:'Right size, wrong sign. Check your positives and negatives.'};
  return{s:'no',msg:'Try again, or press “Show next step”.'}
}

function cancelAll(F){const notes=[];F=F.map(f=>f.slice());
  for(let i=0;i<F.length;i++)for(let j=0;j<F.length;j++){const g=gcd(F[i][0],F[j][1]);
    if(g>1){notes.push(`${F[i][0]} and ${F[j][1]} both divide by ${g} → ${F[i][0]/g} and ${F[j][1]/g}`);F[i][0]/=g;F[j][1]/=g}}
  return{F,notes}}
const prodH=F=>F.map(f=>fr(f[0],f[1])).join(times);
function multSteps(F){ // F already top-heavy, steps for cancel + multiply + simplify
  const steps=[];const{F:G,notes}=cancelAll(F);
  if(notes.length)steps.push(st('Cancel first: any top with any bottom.',notes.join('<br>')+'<br>'+prodH(G)));
  const n=G.reduce((a,f)=>a*f[0],1),d=G.reduce((a,f)=>a*f[1],1);const r=R(n,d);
  steps.push(st('Multiply the tops, and multiply the bottoms.',`${fx(G.map(f=>f[0]).join(' × '),G.map(f=>f[1]).join(' × '))} = ${fr(n,d)}`));
  if(r.d!=d)steps.push(st('Simplify.',`${fr(n,d)} = ${frR(r)}`));
  if(Math.abs(r.n)>r.d&&r.d!=1){const w=Math.floor(r.n/r.d);steps.push(st('Change back to a mixed number.',`${r.n} ÷ ${r.d} = ${w} remainder ${r.n%r.d} → <b>${mixed(r)}</b>`))}
  else steps.push(st('Answer',`<b>${mixed(r)}</b>`));
  return{steps,r}}
const mixH=(w,n,d)=>w?w+fr(n,d):fr(n,d);
const impStep=list=>st('Change mixed numbers into top-heavy fractions.',list.map(([w,n,d])=>`${mixH(w,n,d)} = ${fr(w*d+n,d)} &nbsp;<span class="aside">(${w} × ${d} + ${n} = ${w*d+n})</span>`).join('<br>'));

function buildPct(p,Q,uf){ // non-calculator building blocks, p multiple of 5
  const s=[],parts=[],names=[];let rest=p;
  if(p>=50){s.push(st('Find 50%: halve it.',`50% of ${uf(Q)} = ${uf(Q/2)}`));parts.push(Q/2);names.push('50%');rest-=50}
  if(rest==25){s.push(st('Find 25%: halve 50%.',`25% = ${uf(Q/4)}`));parts.push(Q/4);names.push('25%');rest=0}
  const t=Math.floor(rest/10),five=rest%10==5;
  if(t||five)s.push(st('Find 10%: divide by 10.',`10% of ${uf(Q)} = ${uf(Q/10)}`));
  if(five)s.push(st('Find 5%: half of 10%.',`5% = ${uf(Q/20)}`));
  for(let i=0;i<t;i++){parts.push(Q/10);names.push('10%')}if(five){parts.push(Q/20);names.push('5%')}
  if(parts.length>1)s.push(st(`Build ${p}% from the pieces.`,`${p}% = ${names.join(' + ')} = ${parts.map(uf).join(' + ')} = <b>${uf(Q*p/100)}</b>`));
  else s.push(st('Answer',`<b>${uf(Q*p/100)}</b>`));
  return s}

    {expr:termsA([prod[0],[-prod[1][0],prod[1][1]]],v),msg:'Check the sign of your second term: − × + = − and − × − = +.'},
    {expr:termsA([[-prod[0][0],prod[0][1]],prod[1]],v),msg:'Check the sign of your first term: − × + = − and − × − = +.'}];
  if(e>=1){wrong.push({expr:termsA(prod.map(([c,p],i)=>[c,inside[i][1]==1?e:p]),v),msg:`When you multiply letters, add the powers: ${V(v)} × ${V(v)} = ${V(v)}<sup>2</sup>, ${V(v)}<sup>2</sup> × ${V(v)} = ${V(v)}<sup>3</sup>.`});

}
function partsH(parts,v){let s='';parts.forEach((p,i)=>{
  if(p.k!=null){const a=Math.abs(p.k);s+=(i==0?(p.k<0?MI:''):(p.k<0?' '+MI+' ':' + '))+(a==1?'':a)+'('+termsH(p.in,v)+')'}
  else s+=termH(p.t[0],p.t[1],v,i==0)});return s}
const brTitle=(p,v)=>{const a=Math.abs(p.k);return(p.k<0?MI:'')+(a==1?'':a)+'('+termsH(p.in,v)+')'};
function expandParts(parts,v){const steps=[];const all=[];let wrongAll=null;
  for(const p of parts){if(p.k==null){all.push(p.t);continue}
    const pr=p.in.map(([c,f])=>[p.k*c,f]);all.push(...pr);
    steps.push(st(p.k<0?`Expand ${brTitle(p,v)}. The minus belongs to the ${Math.abs(p.k)}, so it changes every sign inside.`:`Expand ${brTitle(p,v)}.`,
      p.in.map(([c,f])=>`${factorH(p.k,0,v)} × ${factorH(c,f,v)} = ${mono(p.k*c,f,v)}`).join('<br>')))}
  return{steps,all}}
function collectSteps(all,v,label){const col=collect(all);const s=[st('Write it all out.',termsH(all,v))];
  const xs=all.filter(t=>t[1]==1),ns=all.filter(t=>t[1]==0);
  if(xs.length>1)s.push(st(`Collect the ${V(v)} terms.`,`${termsH(xs,v)} = ${termsH(collect(xs),v)}`));
  if(ns.length>1)s.push(st('Collect the numbers.',`${termsH(ns,v)} = ${termsH(collect(ns),v)}`));
  s.push(st('Answer',`<b>${label||''}${termsH(col,v)}</b>`));return{s,col}}
function genExpand2(){

    const parts=[{t:[1,1]},{k:2,in:[[1,1],[-k,0]]}];const{steps,all}=expandParts(parts,'x');const{s,col}=collectSteps(all,'x','P = ');

  let parts;
  if(variant=='two'){const a=br();a.k=Math.abs(a.k)<2?ri(2,8):a.k;const b=br();if(coin(.25))b.k=-1;parts=[a,b];if(coin(.3))parts.push({t:[ri(1,9)*(coin()?-1:1),0]})}
  else{const b=br();if(b.k==-1||b.k==1)b.k=ri(2,7);const loose={t:coin()?[ri(1,9)*(coin(.3)?-1:1),1]:[ri(1,12),0]};
    if(coin(.25)){parts=[{t:[ri(5,15),0]},{k:-1,in:[[ri(1,6),1],[ri(1,9)*(coin()?-1:1),0]]}]}else parts=coin()?[loose,b]:[b,{t:[loose.t[0]*(coin(.5)?-1:1),loose.t[1]]}];
    if(parts[0].t&&parts[0].t[0]<0)parts[0].t[0]*=-1}
  const{steps,all}=expandParts(parts,v);const{s,col}=collectSteps(all,v);
  if(!col.some(t=>t[1]==1))return genExpand2();

  if(neg){const bad=[];for(const p of parts){if(p.k==null)bad.push(p.t);else bad.push(...p.in.map(([c,f],i)=>[(p===neg&&i==1?-1:1)*p.k*c,f]))}

  return{q:`Expand and simplify ${partsH(parts,v)}`,kind:'expr',mode:'simplify',v,ans:termsA(col,v),terms:col.length,wrong,steps:[...steps,...s]}
}
function genFactorise(){
  const v=pick(['x','x','y','w','a','p']);const f=pick(['num','num','var','both','both']);let g,eh,inner;
  if(f=='num'){g=ri(2,9);eh=0;let a,b;do{a=ri(1,6);b=ri(1,12)}while(gcd(a,b)>1);const s=coin()?-1:1;inner=coin(.25)?[[b,0],[-a,1]]:[[a,1],[s*b,0]]}
  else if(f=='var'){g=1;eh=1;const k=ri(1,9)*(coin()?-1:1);inner=[[1,1],[k,0]]}
  else{g=ri(2,6);eh=1;let a,b;do{a=ri(1,5);b=ri(1,9)}while(gcd(a,b)>1);inner=coin(.35)?[[b,0],[-a,1]]:[[a,1],[b*(coin()?-1:1),0]]}
  const full=inner.map(([c,e])=>[c*g,e+eh]);const hcf=mono(g,eh,v);
  const nums=full.map(t=>Math.abs(t[0]));
  const steps=[st('Find the highest common factor (HCF) of the numbers.',g==1?`${nums[0]} and ${nums[1]} have no common factor except 1.`:`HCF of ${nums[0]} and ${nums[1]} is ${g}.`),
    st(`Is there ${v=='x'?'an':'a'} ${V(v)} in every term?`,eh?`Yes, so the HCF is <b>${hcf}</b>.`:`No, so the HCF is just <b>${g}</b>.`),
    st('Write the HCF outside a bracket. Divide each term by it.',full.map((t,i)=>`${mono(t[0],t[1],v)} ÷ ${hcf} = ${mono(inner[i][0],inner[i][1],v)}`).join('<br>')),
    st('Answer',`<b>${hcf}(${termsH(inner,v)})</b>`),
    st('Check by expanding it back.',`${hcf}(${termsH(inner,v)}) = ${termsH(full,v)} ✓`)];
  return{q:`Factorise ${termsH(full,v)}`,kind:'expr',mode:'factorise',v,ans:termsA(full,v),hcf:termsA([[g,eh]],v),fact:termsA([[g,eh]],v)+'('+termsA(inner,v)+')',steps}
}

function solveSteps(L,Rr,v){

    if(A2){steps.push(st(`${A2>0?'Subtract':'Add'} ${mono(Math.abs(A2),1,v)} ${A2>0?'from':'to'} both sides.`,`${side(A1-A2,B1,v)} = ${B2}`))}
    if(B1){steps.push(st(`${B1>0?'Subtract':'Add'} ${Math.abs(B1)} ${B1>0?'from':'to'} both sides.`,`${mono(A1-A2,1,v)} = ${sg(B2-B1)}`))}
    var num=B2-B1,den=A1-A2,onLeft=true}
  else{
    if(A1){steps.push(st(`${A1>0?'Subtract':'Add'} ${mono(Math.abs(A1),1,v)} ${A1>0?'from':'to'} both sides, so the ${V(v)} term stays positive.`,`${sg(B1)} = ${side(A2-A1,B2,v)}`))}
    if(B2){steps.push(st(`${B2>0?'Subtract':'Add'} ${Math.abs(B2)} ${B2>0?'from':'to'} both sides.`,`${sg(B1-B2)} = ${mono(A2-A1,1,v)}`))}
    var num=B1-B2,den=A2-A1,onLeft=false}
  const r=R(num,den);
  if(den!=1)steps.push(st(`Divide both sides by ${den}.`,`${V(v)} = ${fx(sg(num),den)}${gcd(num,den)>1||r.d==1?' = '+frR(r):''}`));
  steps.push(st('Answer',`<b>${V(v)} = ${frR(r)}</b>${Math.abs(r.n)>r.d&&r.d>1?' (or '+mixed(r)+')':''}`));
  return{steps,r}}

  newPractice(T,S);if(!keepScroll)window.scrollTo(0,0)}
function sessionGet(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
function sessionSet(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}

function drawEx(){const q=ex.q,el=$('#ex');const all=ex.k>=q.steps.length;
  el.innerHTML=tidy(`<h2>Worked example</h2><div class="q">${q.q}</div>${figH(q.fig)}${q.choices?`<p class="choices">Options: ${q.choices.map(c=>`<span>${c}</span>`).join('')}</p>`:''}
   <ol class="steps">${q.steps.slice(0,ex.k).map(s=>stepH(s)).join('')}</ol>
   <div class="btns">${all?`<button class="btn" data-a="exnew">Another example</button>`:`<button class="btn pri" data-a="exnext">Show next step</button><button class="btn" data-a="exall">Show all steps</button>`}</div>`);
  drawFigs(el)}

function newPractice(T,S){pr={T,S,key:T.id+'-'+S.id,q:S.gen(),k:0,done:false,tries:0};drawPr()}
function drawPr(){const q=pr.q,el=$('#pr');
  el.innerHTML=tidy(`<div class="pr-head"><h2>Your turn</h2>${q.tag?`<span class="tag">${q.tag}</span>`:''}<span class="pr-stars">${starH(starsOf(pr.key))}</span></div>
   <div class="q">${q.q}</div>${figH(q.fig)}
   ${q.kind=='mcq'?`<div class="mcq">${q.choices.map(c=>`<button class="opt" data-a="opt" data-v="${esc(c)}">${c}</button>`).join('')}</div>`
   :`<form class="ans" novalidate><label for="ansIn">Your answer${q.unit?` <span class="unit">(${esc(q.unit)})</span>`:''}</label>
     <div class="row"><input id="ansIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done"><button class="btn pri" type="submit">Check</button></div>
     ${keysH(q)}<p class="hint">${hintFor(q)}</p></form>`}
   <div class="fb" aria-live="polite"></div>
   <ol class="steps" id="prSteps"></ol>
   <div class="btns"><button class="btn" data-a="hint">Help: show the first step</button><button class="btn" data-a="newq">New question</button></div>`);
  drawFigs(el)}
function setFb(r){const fb=$('#pr .fb');if(!fb)return;
  const head={ok:'✓ Correct!',nearly:'Nearly there.',no:'Not quite.',bad:'Hmm.',empty:''}[r.s];
  fb.className='fb '+r.s;fb.innerHTML=tidy(`${head?`<b>${head}</b> `:''}${r.msg||''}${r.note?' '+r.note:''}${r.star?' <span class="plus">+1 star</span>':''}${r.s=='ok'?`<div><button class="btn pri" data-a="newq" id="nextQ">Next question →</button></div>`:''}`);
  if(r.s=='ok'){const n=$('#nextQ');n&&n.focus({preventScroll:true})}}
function revealStep(){const q=pr.q;if(pr.k>=q.steps.length)return;const ol=$('#prSteps');
  ol.insertAdjacentHTML('beforeend',tidy(stepH(q.steps[pr.k],pr.k)));pr.k++;drawFigs(ol);
  const b=$('#pr [data-a="hint"]');if(b){b.textContent=pr.k>=q.steps.length?'All steps shown':'Show next step';b.disabled=pr.k>=q.steps.length}}
function award(){if(pr.done)return false;pr.done=true;if(pr.k>=pr.q.steps.length)return false;
  store[pr.key]=store[pr.key]||{s:0};store[pr.key].s++;save();
  const n=starsOf(pr.key);const ps=$('#pr .pr-stars');if(ps)ps.innerHTML=starH(n);
  const tab=document.querySelector(`.tab[href="#${pr.key}"] .stars`);if(tab)tab.outerHTML=starH(n);return true}
function submit(){const inp=$('#ansIn');if(!inp)return;if(pr.done){newPractice(pr.T,pr.S);return}
  const r=check(pr.q,inp.value);if(r.s=='ok')r.star=award();else if(r.s=='no'){pr.tries++;if(pr.tries>=2&&pr.k<pr.q.steps.length)r.msg+=' Try pressing “Show next step”.'}
  setFb(r)}

/* ---------- events ---------- */
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a=='exnext'){ex.k++;drawEx()}
  else if(a=='exall'){ex.k=ex.q.steps.length;drawEx()}
  else if(a=='exnew'){ex.seed++;ex.k=1;ex.q=withSeed(ex.seed,ex.S.gen);drawEx()}
  else if(a=='hint')revealStep();
  else if(a=='jump'){const p=$('#pr');p&&p.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
  else if(a=='newq'){newPractice(pr.T,pr.S);const i=$('#ansIn');i&&i.focus({preventScroll:true})}
  else if(a=='key'){const i=$('#ansIn');if(!i)return;const c=b.dataset.v=='−'?'-':b.dataset.v;const p=i.selectionStart??i.value.length,q=i.selectionEnd??p;
    i.value=i.value.slice(0,p)+c+i.value.slice(q);i.focus();i.setSelectionRange(p+c.length,p+c.length)}
  else if(a=='opt'){if(pr.done)return;const r=check(pr.q,b.dataset.v);
    if(r.s=='ok'){b.classList.add('right');r.star=award();app.querySelectorAll('#pr .opt').forEach(o=>o.disabled=true)}else{b.classList.add('wrong');b.disabled=true}
    setFb(r)}});
app.addEventListener('submit',e=>{e.preventDefault();submit()});
app.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('remember'))sessionSet('rem-'+d.dataset.t,d.open?'1':'0')},true);

function route(){const h=decodeURIComponent(location.hash.slice(1));
  if(h=='sheet')return renderSheet();
  const T=TOPICS.find(t=>h===t.id||h.startsWith(t.id+'-'));
  if(T){const sid=h.slice(T.id.length+1);const S=T.skills.find(s=>s.id===sid)||T.skills[0];
    const same=pr.T===T;renderTopic(T,S,same);if(same){const g=document.querySelector('.tabs');g&&g.scrollIntoView({block:'start'})}return}
  renderHome()}
window.addEventListener('hashchange',route);
route();

})();
</script>
</body>
</html>
